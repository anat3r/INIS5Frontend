<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header>
        <h1>Aplikacja pogodowa</h1>
    </header>
    <main id="box">
        <!-- Zawartość będzie dodana przez JavaScript -->
        <section id="weather">
            <section id="search">
                <input type="text" name="" placeholder="podaj nazwę miasta" id="city_input">
                <button id="search_button" type="submit">Sprawdź pogodę!</button>
                <h3 id="error_msg"></h3>
            </section>
            <section id="weather_info">
                <hr />
                <h2 id="city_name"></h2>
                
                <div id="weather_img_and_temp">
                    <div>
                        <img src="" sizes="48" alt="" id="weather_img">
                        <p id="temp"></p>
                    </div>
                    <p id="weather_description"></p>
                </div>
                <table id="temp_table">
                    <tr>
                        <th>Temperatura odczuwalna</th>
                        <th>Ciśninie</th>
                        <th>Wilgotność</th>
                        <th>Prędkość wiatru</th>
                        <th>Widoczność</th>
                        <th>Zachmurzenie</th>
                    </tr>
                    <tr id ="temp_data">
                        <td id="feels_like">-</td>
                        <td id="pressure">-</td>
                        <td id="humidity">-</td>
                        <td id="wind_speed">-</td>
                        <td id="visibility">-</td>
                        <td id="clouds">-</td>
                    </tr>
                </table>
            </section>
        </section>
        <hr />
        <section id="pollution_info">
            <h3>Zanieczyszczenie powiertza</h3>
            <table id="pollution_table">
                <tr>
                    <th id="pollution_name">
                        <div>Zanieczyszczenie powietrza `</div><img src="./src/img/7304531_pm2.5_dust_pollution_smog_dangerous_icon.png" alt="" class="img_pollution">
                    </th>
                </tr>
                <tr>
                    <th pol-value="0" class="pol_row">
                        <p id="pol_value"></p>
                        <p>&micro;g/m<sup>3</sup></p>
                    </th>
                </tr>
            </table>
        </section>
    </main>
    <hr style="border: solid 2px darkblue ;"/>
    <footer>
        <h4>projekt WSB Merito Gdańsk 2025</h4>
        <h4>Autor: Ruslan B.</h4>
    </footer>
    <script src="./script.js"></script>
</body>
</html>
